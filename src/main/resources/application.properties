spring.application.name=pdg
spring.config.import=optional:file:.env[.properties]
gemini.api.key=${GEMINI_API_KEY:change-me}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}
# Vía alternativa: Vertex AI con credenciales de Google Cloud (ADC) y la facturación del proyecto.
gemini.api.vertex=${GEMINI_VERTEX:false}
gemini.api.project=${GEMINI_PROJECT:}
gemini.api.location=${GEMINI_LOCATION:global}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vista_pdg}
spring.datasource.username=${DB_USER:vista}
spring.datasource.password=${DB_PASSWORD:vista123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT — token pair
jwt.secret=${JWT_SECRET:v1sta-pdg-super-secret-key-for-hs256-algo-minimum-32chars-2024}
# Acceso: corto, no revocable. Refresco: largo, persistido y revocable.
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Registro: dominios de correo admitidos. Vacio = cualquier dominio.
auth.allowed-email-domains=${AUTH_ALLOWED_EMAIL_DOMAINS:u.icesi.edu.co,icesi.edu.co}
auth.min-password-length=${AUTH_MIN_PASSWORD_LENGTH:8}

# Telemetria (HU-16): clave del seudonimo. Independiente de jwt.secret a proposito.
telemetry.pseudonym-secret=${TELEMETRY_PSEUDONYM_SECRET:v1sta-telemetry-pseudonym-key-min-32-chars-change-me}

# Asistente (HU-17): cuota diaria por defecto (la del curso la sobreescribe), limite de tasa y
# zona horaria en la que se reinicia la ventana diaria a medianoche.
assistant.quota.daily-default=${ASSISTANT_DAILY_QUOTA:40}
assistant.quota.warning-ratio=${ASSISTANT_WARNING_RATIO:0.2}
assistant.rate.per-minute=${ASSISTANT_RATE_PER_MINUTE:5}
assistant.timezone=${ASSISTANT_TIMEZONE:America/Bogota}
