name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Spotless
        run: ./mvnw -B -ntp spotless:check

      # Testcontainers levanta su propio Postgres con el Docker del runner. `verify` incluye la
      # puerta de JaCoCo: 80 % de líneas en los módulos que toca la HU vigente.
      - name: Pruebas y puerta de cobertura
        run: ./mvnw -B -ntp verify

      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire
          path: target/surefire-reports
          if-no-files-found: ignore

  # Un cambio de backend puede romper el frontend sin que ninguna prueba de este repo lo note.
  # El flujo compartido levanta este backend con el frontend de la rama pareja (mismo nombre) si
  # existe, o con main, y corre Cypress en ambos navegadores.
  e2e:
    name: E2E (frontend pareja o main)
    needs: verify
    uses: vista-pdg/dev-workflow/.github/workflows/e2e.yml@main
    with:
      backend-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      frontend-ref: auto
    secrets:
      VISTA_REPO_TOKEN: ${{ secrets.VISTA_REPO_TOKEN }}

  # CD: tras pasar las pruebas, construye la imagen, la sube a Artifact Registry y
  # actualiza Cloud Run. Auth sin llaves (Workload Identity Federation, vars en el repo).
  deploy:
    name: Build y deploy a Cloud Run
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}/backend
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/setup-gcloud@v3

      # Solo cambia la imagen; env, secretos y recursos los gestiona terraform-iac.
      - name: Deploy
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --container backend \
            --image "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
