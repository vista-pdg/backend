name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Spotless
        run: ./mvnw -B -ntp spotless:check

      # Testcontainers levanta su propio Postgres con el Docker del runner. `verify` incluye la
      # puerta de JaCoCo: 80 % de líneas en los módulos que toca la HU vigente.
      - name: Pruebas y puerta de cobertura
        run: ./mvnw -B -ntp verify

      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire
          path: target/surefire-reports
          if-no-files-found: ignore

  # Un cambio de backend puede romper el frontend sin que ninguna prueba de este repo lo note.
  # El flujo compartido levanta este backend con el frontend de main y corre Cypress en ambos
  # navegadores.
  e2e:
    name: E2E con el frontend en main
    needs: verify
    uses: vista-pdg/dev-workflow/.github/workflows/e2e.yml@main
    with:
      backend-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      frontend-ref: auto
    secrets:
      VISTA_REPO_TOKEN: ${{ secrets.VISTA_REPO_TOKEN }}
